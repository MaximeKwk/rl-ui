name: Build

# Tests + Windows installer. Runs only for a new version (tag vX.Y.Z) or manually
# (Actions tab > Build > Run workflow), so GitHub Actions minutes aren't spent on every push.
# Releasing: bump "version" in package.json, add the section to CHANGELOG.md, then
#   git tag v1.2.0 && git push --tags
# -> the .exe files and latest.yml (used by the in-app auto-update) are attached to the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end test (simulator)
        run: npm run e2e

      - name: Installer + portable version
        run: npx electron-builder --win nsis portable --publish never

      - name: Release notes (from CHANGELOG.md)
        shell: bash
        run: node tools/release-notes.js > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: RL-UI-windows
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: RL-UI ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/RL-UI-Setup-*.exe
            dist/RL-UI-Setup-*.exe.blockmap
            dist/RL-UI-Portable-*.exe
            dist/latest.yml
