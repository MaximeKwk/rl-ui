<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <title>RL-UI — Recent matches</title>
    <link rel="stylesheet" href="/static/shared/overlay.css" />
    <style>
      body { padding: calc(14px * var(--s)); display: flex; }
      body.align-center { justify-content: center; }
      body.align-right { justify-content: flex-end; }
      .bar {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        gap: calc(8px * var(--s));
        gap: calc(5px * var(--s));
        padding: calc(10px * var(--s)) calc(16px * var(--s)) calc(10px * var(--s)) calc(18px * var(--s));
        background: var(--plate);
        clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      }
      body.bare .bar { background: none; clip-path: none; padding: 0; }
      .ttl {
        font-size: calc(18px * var(--s));
        font-weight: 700;
        opacity: 0.55;
        margin-right: calc(10px * var(--s));
        writing-mode: horizontal-tb;
      }
      /* une rangée de voyants : plein = victoire / défaite, barre ambre = overtime */
      .pill {
        position: relative;
        width: calc(34px * var(--s));
        height: calc(46px * var(--s));
        border-radius: calc(3px * var(--s));
        display: grid;
        place-items: center;
        font-size: calc(24px * var(--s));
        font-weight: 800;
        color: #07120d;
        background: var(--win);
      }
      .pill.l { background: var(--loss); color: #fff; }
      .pill.a { opacity: 0.5; }
      .pill.ot { box-shadow: inset 0 calc(5px * var(--s)) 0 var(--ot); }
      .pill.new { animation: popIn 0.4s ease-out; }
      @keyframes popIn { from { transform: translateY(calc(-10px * var(--s))); opacity: 0; } }
      .empty { font-size: calc(22px * var(--s)); font-weight: 700; opacity: 0.55; padding: 0 calc(8px * var(--s)); }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"><div class="deco"></div><span class="ttl" id="ttl" data-i18n="ov.recent">Recent</span><span id="pills"></span></div>
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/client.js"></script>
    <script>
      (function () {
        const P = OT.params;
        if (P.get('preview')) document.body.classList.add('preview');
        if (P.get('bare') === '1') document.body.classList.add('bare');
        document.body.classList.add(`align-${P.get('align') || 'left'}`);
        const n = OT.num('n', 10);
        const newestFirst = P.get('order') !== 'old';
        const pills = document.getElementById('pills');
        pills.style.display = 'inline-flex';
        pills.style.gap = 'calc(8px * var(--s))';
        if (P.get('title') === '0') document.getElementById('ttl').style.display = 'none';
        let labels = { w: 'W', l: 'L' };
        let seen = null;
        function render(st) {
          const last = ((st && st.session && st.session.last) || []).slice(-n);
          const list = newestFirst ? [...last].reverse() : last;
          const ids = new Set(list.map((r) => r.id));
          if (!list.length) {
            pills.innerHTML = `<span class="empty">${OT.esc(OT.t('ov.noMatch'))}</span>`;
            seen = ids;
            return;
          }
          pills.innerHTML = list
            .map((r) => {
              const cls = ['pill', r.result === 'W' ? 'w' : 'l', r.ot ? 'ot' : '', r.abandon ? 'a' : '', seen && !seen.has(r.id) ? 'new' : ''].join(' ');
              return `<span class="${cls}" title="${OT.esc(r.score)}">${r.result === 'W' ? OT.esc(labels.w) : OT.esc(labels.l)}</span>`;
            })
            .join('');
          seen = ids;
        }
        OT.on('config', (c) => {
          OT.applyColors(c.overlay);
          labels = { w: c.overlay.labelWin || OT.t('lbl.w'), l: c.overlay.labelLoss || OT.t('lbl.l') };
          document.documentElement.style.setProperty('--s', OT.num('scale', Number(c.overlay.scale) || 1));
          render(OT.state);
        });
        OT.on('state', render);
        OT.connect({ overlay: 'history' });
      })();
    </script>
  </body>
</html>
