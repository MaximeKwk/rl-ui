<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <title>RL-UI — Alerts</title>
    <link rel="stylesheet" href="/static/shared/overlay.css" />
    <style>
      /* Alertes : un bandeau d'habillage télé. Une plaque qui s'ouvre de gauche à droite,
         une barre de couleur pour le type d'alerte, le titre, puis le détail en cases. */
      html, body { width: 100vw; height: 100vh; }
      #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .stage.pos-top { align-items: flex-start; padding-top: calc(70px * var(--s)); }
      .stage.pos-bottom { align-items: flex-end; padding-bottom: calc(90px * var(--s)); }

      .al {
        --c1: var(--win); /* couleur du titre */
        --bar: var(--win); /* barre de gauche */
        --cut2: calc(26px * var(--s));
        isolation: isolate;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: calc(820px * var(--s));
        max-width: 94vw;
        padding: calc(26px * var(--s)) calc(56px * var(--s)) calc(26px * var(--s)) calc(60px * var(--s));
        text-align: left;
      }
      .al.t-loss { --c1: var(--loss); --bar: var(--loss); }
      .al.t-overtime { --c1: var(--ot); --bar: var(--ot); }
      .al.t-ot_win { --c1: var(--win); --bar: var(--ot); }
      .al.t-ot_loss { --c1: var(--loss); --bar: var(--ot); }
      .al.t-streak { --c1: var(--win); --bar: var(--ot); }

      /* plaque (coins coupés) et barre de couleur : dessinées à part pour que l'image d'un thème (.art) puisse dépasser */
      .al::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: var(--plate);
        clip-path: polygon(var(--cut2) 0, 100% 0, 100% calc(100% - var(--cut2)), calc(100% - var(--cut2)) 100%, 0 100%, 0 var(--cut2));
        animation: open 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .al::before {
        content: '';
        position: absolute;
        left: 0;
        top: var(--cut2);
        bottom: 0;
        width: calc(16px * var(--s));
        z-index: -1;
        background: var(--bar);
        transform-origin: 50% 100%;
        animation: rise 0.35s ease-out 0.15s both;
      }
      @keyframes open {
        from { clip-path: polygon(0 0, 0 0, 0 calc(100% - var(--cut2)), 0 100%, 0 100%, 0 var(--cut2)); }
      }
      @keyframes rise { from { transform: scaleY(0); } }

      .kicker {
        position: relative;
        font-size: calc(28px * var(--s));
        font-weight: 700;
        color: rgba(255, 255, 255, 0.62);
        margin-bottom: calc(2px * var(--s));
        animation: slide 0.45s ease-out 0.22s both;
      }
      .kicker:empty { display: none; }

      .title { position: relative; animation: slide 0.45s ease-out 0.16s both; }
      .tx {
        display: block;
        font-weight: 800;
        font-size: calc(var(--fs, 200px) * var(--s));
        line-height: 0.9;
        letter-spacing: 0.005em;
        color: var(--c1);
        white-space: nowrap;
        padding-bottom: 0.02em;
      }
      .gl { display: none; }
      @keyframes slide { from { opacity: 0; transform: translateX(calc(-24px * var(--s))); } }

      /* le détail : des cases séparées par des filets */
      .subs {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-self: stretch;
        margin-top: calc(18px * var(--s));
        padding-top: calc(16px * var(--s));
        border-top: 1px solid var(--plate-line);
        animation: fade 0.4s ease-out 0.4s both;
      }
      .subs:empty { display: none; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: calc(10px * var(--s));
        padding: 0 calc(28px * var(--s));
        border-left: 1px solid var(--plate-line);
        font-size: calc(34px * var(--s));
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
      }
      .chip:first-child { padding-left: 0; border-left: 0; }
      .chip.score { font-size: calc(42px * var(--s)); font-weight: 800; font-variant-numeric: tabular-nums; }
      .chip.score b.me { color: var(--c1); }
      .chip.score i { font-style: normal; opacity: 0.4; }
      .chip.mmr { font-weight: 800; }
      .chip.mmr.up { color: var(--win); }
      .chip.mmr.down { color: var(--loss); }
      .chip.hl { color: var(--ot); }
      .chip .ico { width: 0.85em; height: 0.85em; }
      @keyframes fade { from { opacity: 0; } }

      /* sortie : la plaque se referme vers la droite */
      .al.out::after { animation: close 0.4s ease-in forwards; }
      .al.out > *, .al.out::before { animation: gone 0.25s ease-in forwards; }
      @keyframes close {
        to { clip-path: polygon(100% 0, 100% 0, 100% calc(100% - var(--cut2)), 100% 100%, 100% 100%, 100% var(--cut2)); }
      }
      @keyframes gone { to { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .al::after, .al::before, .kicker, .title, .subs { animation: none !important; }
      }

      /* alertes dessinées par un thème de l'éditeur : la toile du thème, mise à l'échelle de l'écran et centrée */
      #cmp { position: fixed; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div id="stage" class="stage pos-center"></div>
    <div id="cmp"></div>
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/client.js"></script>
    <script src="/static/shared/sfx.js"></script>
    <script src="/static/shared/fx.js"></script>
    <script src="/static/shared/compose.js"></script>
    <script src="/static/overlay/alerts.js"></script>
  </body>
</html>
