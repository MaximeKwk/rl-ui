<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <title>RL-UI — Session recap</title>
    <link rel="stylesheet" href="/static/shared/overlay.css" />
    <style>
      html, body { width: 100vw; height: 100vh; }
      body { display: flex; align-items: center; justify-content: center; }
      .card {
        isolation: isolate;
        position: relative;
        width: calc(1180px * var(--s));
        padding: calc(46px * var(--s)) calc(56px * var(--s)) calc(40px * var(--s));
        --cut2: calc(30px * var(--s));
        animation: open 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      /* plaque à coins coupés + liseré facultatif (coloré par les thèmes) */
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: var(--plate);
        clip-path: polygon(var(--cut2) 0, 100% 0, 100% calc(100% - var(--cut2)), calc(100% - var(--cut2)) 100%, 0 100%, 0 var(--cut2));
      }
      .card::before { content: ''; position: absolute; left: var(--cut2); right: 0; top: 0; height: calc(4px * var(--s)); background: transparent; }
      @keyframes open { from { opacity: 0; transform: translateX(calc(-30px * var(--s))); } }
      .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: calc(18px * var(--s)); border-bottom: 1px solid var(--plate-line); }
      .head h1 { margin: 0; font-size: calc(40px * var(--s)); font-weight: 800; }
      .head .who { font-size: calc(26px * var(--s)); font-weight: 700; opacity: 0.6; }
      .main { display: flex; align-items: flex-end; justify-content: space-between; margin: calc(26px * var(--s)) 0 calc(28px * var(--s)); }
      .rec { display: flex; align-items: flex-end; gap: calc(30px * var(--s)); }
      .big b { display: block; font-size: calc(170px * var(--s)); line-height: 0.85; font-weight: 800; font-variant-numeric: tabular-nums; }
      .big i { display: block; font-style: normal; font-size: calc(24px * var(--s)); font-weight: 600; opacity: 0.6; margin-top: calc(8px * var(--s)); }
      .big.w b { color: var(--win); }
      .big.l b { color: var(--loss); }
      .vs { width: 1px; height: calc(140px * var(--s)); background: var(--plate-line); font-size: 0; margin-bottom: calc(36px * var(--s)); }
      /* winrate : un grand chiffre, sans anneau */
      .ring { text-align: right; }
      .ring svg { display: none; }
      .ring .val b { font-size: calc(110px * var(--s)); font-weight: 800; line-height: 0.85; }
      .ring .val i { display: block; font-style: normal; font-size: calc(24px * var(--s)); opacity: 0.6; font-weight: 600; margin-top: calc(8px * var(--s)); }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--plate-line); }
      .tile { padding: calc(16px * var(--s)) calc(20px * var(--s)); border-bottom: 1px solid var(--plate-line); border-left: 1px solid var(--plate-line); }
      .tile:nth-child(4n + 1) { border-left: 0; padding-left: 0; }
      .tile b { display: block; font-size: calc(46px * var(--s)); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
      .tile i { display: block; font-style: normal; font-size: calc(19px * var(--s)); font-weight: 600; opacity: 0.55; margin-top: calc(6px * var(--s)); }
      .tile.hot b { color: var(--ot); }
      .tile.ot b { color: var(--ot); }
      .last { display: flex; align-items: center; gap: calc(5px * var(--s)); margin-top: calc(24px * var(--s)); }
      .last span.t { font-size: calc(20px * var(--s)); font-weight: 600; opacity: 0.55; margin-right: calc(12px * var(--s)); }
      .pill {
        width: calc(30px * var(--s));
        height: calc(40px * var(--s));
        border-radius: calc(3px * var(--s));
        display: grid;
        place-items: center;
        font-size: calc(22px * var(--s));
        font-weight: 800;
        background: var(--win);
        color: #06130d;
        position: relative;
      }
      .pill.l { background: var(--loss); color: #fff; }
      .pill.ot { box-shadow: inset 0 calc(5px * var(--s)) 0 var(--ot); }
      /* thème de l'éditeur : il dessine lui-même le récap, sur sa toile mise à l'échelle de l'écran */
      .hidden { display: none !important; }
      #cmp { position: fixed; left: 0; top: 0; transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="deco"></div>
      <div class="head"><h1 id="title" data-i18n="ov.recap">Session recap</h1><span class="who" id="who"></span></div>
      <div class="main">
        <div class="rec">
          <div class="big w"><b id="w">0</b><i id="lw" data-i18n="ov.wins">Wins</i></div>
          <div class="vs">–</div>
          <div class="big l"><b id="l">0</b><i id="ll" data-i18n="ov.losses">Losses</i></div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" />
            <circle id="arcL" cx="60" cy="60" r="52" fill="none" stroke="var(--loss)" stroke-width="10" stroke-dasharray="0 999" />
            <circle id="arcW" cx="60" cy="60" r="52" fill="none" stroke="var(--win)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 999" />
          </svg>
          <div class="val"><div><b id="wr">—</b><i data-i18n="ov.winrate">winrate</i></div></div>
        </div>
      </div>
      <div class="grid">
        <div class="tile hot"><b id="best">0</b><i data-i18n="ov.best">Best streak</i></div>
        <div class="tile ot"><b id="ot">0-0</b><i>Overtime</i></div>
        <div class="tile"><b id="mvp">0</b><i>MVP</i></div>
        <div class="tile"><b id="time">0 min</b><i data-i18n="ov.time">Time played</i></div>
        <div class="tile"><b id="goals">0</b><i data-i18n="ov.goals">Goals</i></div>
        <div class="tile"><b id="assists">0</b><i data-i18n="ov.assists">Assists</i></div>
        <div class="tile"><b id="saves">0</b><i data-i18n="ov.saves">Saves</i></div>
        <div class="tile" id="gdTile"><b id="gd">0</b><i id="gdLbl">Goal diff.</i></div>
      </div>
      <div class="last"><span class="t" data-i18n="ov.recent">Recent</span><span id="pills" style="display: inline-flex; gap: calc(8px * var(--s))"></span></div>
    </div>
    <div id="cmp" class="hidden"></div>
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/client.js"></script>
    <script src="/static/shared/compose.js"></script>
    <script>
      (function () {
        const P = OT.params;
        if (P.get('preview')) document.body.classList.add('preview');
        const $ = (id) => document.getElementById(id);
        // thème composé (éditeur visuel) : { view, comp }
        let composed = null;
        let composedSig = '';
        let overlayCfg = {};
        function placeComposed() {
          if (!composed) return;
          const { comp } = composed;
          const k = (Math.min(innerWidth / comp.width, innerHeight / comp.height) || 1) * OT.num('scale', 1);
          const host = $('cmp');
          host.style.width = `${comp.width}px`;
          host.style.height = `${comp.height}px`;
          host.style.left = `${(innerWidth - comp.width * k) / 2}px`;
          host.style.top = `${(innerHeight - comp.height * k) / 2}px`;
          host.style.transform = `scale(${k})`;
        }
        addEventListener('resize', placeComposed);
        function mountCompose(c) {
          const pack = (c && c.theme) || {};
          const comp = pack.compose && pack.compose.summary ? pack.compose.summary : null;
          $('cmp').classList.toggle('hidden', !comp);
          document.querySelector('.card').classList.toggle('hidden', !!comp);
          if (!comp) {
            composed = null;
            composedSig = '';
            $('cmp').textContent = '';
            return;
          }
          const sig = `${pack.id}|${pack.v}|${JSON.stringify(comp)}`;
          if (sig !== composedSig) {
            composedSig = sig;
            $('cmp').textContent = '';
            const view = window.Compose.mount($('cmp'), comp, { imageUrl: (src) => `${pack.assets || ''}${src}?v=${pack.v || 0}` });
            composed = { view, comp };
            view.enter(comp.enter || 'fade');
          }
          placeComposed();
        }
        const C = 2 * Math.PI * 52;
        let labels = { w: 'W', l: 'L' };
        function scale(c) {
          const vs = Math.min(innerWidth / 1920, innerHeight / 1080) || 1;
          document.documentElement.style.setProperty('--s', vs * OT.num('scale', 1));
        }
        addEventListener('resize', scale);
        scale();
        function fmtTime(sec) {
          const m = Math.round(sec / 60);
          return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : `${m} min`;
        }
        function render(st) {
          if (!st) return;
          if (composed) {
            // (&mmr=0 dans l'adresse : le MMR n'est pas montré)
            const d = window.Compose.dataFrom(st, overlayCfg, OT.t);
            if (P.get('mmr') === '0') Object.assign(d, { mmr: null, mmrDelta: null });
            return composed.view.update(d);
          }
          const s = st.session;
          $('w').textContent = s.wins;
          $('l').textContent = s.losses;
          $('wr').textContent = s.played ? `${s.winRate}%` : '—';
          const wl = s.played ? (s.wins / s.played) * C : 0;
          $('arcW').setAttribute('stroke-dasharray', `${wl} ${C}`);
          $('arcL').setAttribute('stroke-dasharray', s.played ? `${C} 0` : `0 ${C}`);
          $('best').textContent = s.bestWinStreak;
          $('ot').textContent = `${s.otWins}-${s.otLosses}`;
          $('mvp').textContent = s.mvps;
          $('time').textContent = fmtTime(s.timePlayedSec);
          $('goals').textContent = s.myGoals;
          $('assists').textContent = s.myAssists;
          $('saves').textContent = s.mySaves;
          // MMR de la session si connu, sinon différence de buts
          const mm = s.mmr && s.mmr.primary;
          if (mm && (mm.games || mm.current != null) && P.get('mmr') !== '0') {
            const d = Math.round(mm.delta || 0);
            $('gd').textContent = d > 0 ? `+${d}` : d;
            $('gd').style.color = d > 0 ? 'var(--win)' : d < 0 ? 'var(--loss)' : '';
            $('gdLbl').textContent = 'MMR';
          } else {
            const gd = s.goalsFor - s.goalsAgainst;
            $('gd').textContent = gd > 0 ? `+${gd}` : gd;
            $('gd').style.color = '';
            $('gdLbl').textContent = OT.t('ov.gd');
          }
          $('who').textContent = st.status && st.status.account ? st.status.account : '';
          $('pills').innerHTML = s.last
            .slice(-12)
            .map((r) => `<span class="pill ${r.result === 'W' ? 'w' : 'l'} ${r.ot ? 'ot' : ''}">${r.result === 'W' ? OT.esc(labels.w) : OT.esc(labels.l)}</span>`)
            .join('');
        }
        OT.on('config', (c) => {
          OT.applyColors(c.overlay);
          labels = { w: c.overlay.labelWin || OT.t('lbl.w'), l: c.overlay.labelLoss || OT.t('lbl.l') };
          overlayCfg = c.overlay || {};
          mountCompose(c);
          render(OT.state);
        });
        OT.on('state', render);
        OT.connect({ overlay: 'summary' });
      })();
    </script>
  </body>
</html>
