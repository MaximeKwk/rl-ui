<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <title>RL-UI — Caster</title>
    <link rel="stylesheet" href="/static/shared/overlay.css" />
    <style>
      /* Overlay caster : pensé pour 1920x1080, tout est multiplié par --s */
      :root {
        --blue: #1873ff;
        --orange: #ff7a1a;
        --panel: rgba(8, 11, 20, 0.9);
        --line: rgba(255, 255, 255, 0.12);
        --gold: #ffd35a;
      }
      body { width: 100vw; height: 100vh; }
      .root { position: fixed; inset: 0; opacity: 0; transition: opacity 0.5s; }
      .root.on { opacity: 1; }
      .hide { display: none !important; }
      .c0 { --tc: var(--blue); }
      .c1 { --tc: var(--orange); }

      /* ---------------- Scorebug ---------------- */
      .bug {
        position: absolute;
        left: 50%;
        top: calc(18px * var(--s));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        filter: drop-shadow(0 calc(8px * var(--s)) calc(20px * var(--s)) rgba(0, 0, 0, 0.5));
      }
      .bug .row { display: flex; align-items: stretch; height: calc(78px * var(--s)); position: relative; isolation: isolate; }
      .bug .team {
        width: calc(330px * var(--s));
        display: flex;
        align-items: center;
        gap: calc(14px * var(--s));
        padding: 0 calc(20px * var(--s));
        background: var(--tc);
        position: relative;
        overflow: hidden;
      }
      .bug .team.c0 { justify-content: flex-end; border-radius: calc(14px * var(--s)) 0 0 calc(14px * var(--s)); clip-path: polygon(0 0, 100% 0, 100% 100%, 4% 100%); }
      .bug .team.c1 { flex-direction: row-reverse; justify-content: flex-end; border-radius: 0 calc(14px * var(--s)) calc(14px * var(--s)) 0; clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%); }
      .bug .team::after {
        content: '';
        position: absolute;
        inset: 0;
        background: none;
        pointer-events: none;
      }
      .bug .tname {
        font-size: calc(34px * var(--s));
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: none;
        min-width: 0;
      }
      .bug .score {
        width: calc(92px * var(--s));
        display: grid;
        place-items: center;
        background: var(--panel);
        font-size: calc(60px * var(--s));
        font-weight: 900;
        font-style: normal;
        line-height: 1;
        border-bottom: calc(4px * var(--s)) solid var(--tc);
      }
      .bug .score.pop { animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes pop { 35% { transform: translateY(-8%); } 100% { transform: none; } }
      .bug .clock {
        width: calc(150px * var(--s));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #05070d;
        border-bottom: calc(4px * var(--s)) solid rgba(255, 255, 255, 0.25);
      }
      .bug .clock b { font-size: calc(42px * var(--s)); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
      .bug .clock i {
        font-style: normal;
        font-size: calc(13px * var(--s));
        font-weight: 800;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.55);
        height: calc(14px * var(--s));
      }
      .bug .clock.ot { border-bottom-color: var(--gold); }
      .bug .clock.ot b, .bug .clock.ot i { color: var(--gold); }
      .bug .clock.replay i { color: #ff5a6a; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.3; } }
      .bug .sub {
        margin-top: calc(-1px * var(--s));
        display: flex;
        align-items: center;
        gap: calc(16px * var(--s));
        padding: calc(5px * var(--s)) calc(22px * var(--s));
        background: var(--panel);
        border-radius: 0 0 calc(12px * var(--s)) calc(12px * var(--s));
        font-size: calc(15px * var(--s));
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
      }
      .pips { display: flex; gap: calc(6px * var(--s)); }
      .pips i {
        width: calc(26px * var(--s));
        height: calc(8px * var(--s));
        border-radius: calc(3px * var(--s));
        background: rgba(255, 255, 255, 0.14);
        transform: skewX(-20deg);
      }
      .pips i.on { background: var(--tc); }
      .sub .mid { white-space: nowrap; }
      .sub .ttl { color: #fff; }

      /* logos et photos (onglet Caster) */
      .bug .logo { height: calc(58px * var(--s)); width: calc(58px * var(--s)); object-fit: contain; flex: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45)); }
      .target .photo { width: calc(82px * var(--s)); height: calc(82px * var(--s)); border-radius: 50%; object-fit: cover; flex: none; border: calc(3px * var(--s)) solid var(--tc); background: #05070d; }
      .post .head .tm { display: flex; align-items: center; gap: calc(18px * var(--s)); }
      .post .head .tm.c1 { flex-direction: row-reverse; }
      .post .head .tm .logo { height: calc(84px * var(--s)); width: calc(84px * var(--s)); object-fit: contain; }
      .post td .av { width: calc(30px * var(--s)); height: calc(30px * var(--s)); border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: calc(10px * var(--s)); }

      /* ---------------- Boost des joueurs ---------------- */
      .boosts { position: absolute; top: calc(24px * var(--s)); display: flex; flex-direction: column; gap: calc(8px * var(--s)); width: calc(330px * var(--s)); }
      .boosts.c0 { left: calc(24px * var(--s)); }
      .boosts.c1 { right: calc(24px * var(--s)); }
      .pl {
        position: relative;
        background: var(--panel);
        border-radius: calc(10px * var(--s));
        padding: calc(7px * var(--s)) calc(12px * var(--s)) calc(9px * var(--s));
        border: calc(2px * var(--s)) solid transparent;
        transition: border-color 0.25s, opacity 0.25s, transform 0.25s;
        overflow: hidden;
      }
      .boosts.c0 .pl { border-left: calc(5px * var(--s)) solid var(--tc); }
      .boosts.c1 .pl { border-right: calc(5px * var(--s)) solid var(--tc); text-align: right; }
      .pl.tgt { border-color: rgba(255, 255, 255, 0.85); transform: scale(1.03); }
      .boosts.c0 .pl.tgt { border-left-color: var(--tc); transform-origin: left; }
      .boosts.c1 .pl.tgt { border-right-color: var(--tc); transform-origin: right; }
      .pl.dead { opacity: 0.45; }
      .pl .top { display: flex; align-items: baseline; justify-content: space-between; gap: calc(10px * var(--s)); }
      .boosts.c1 .pl .top { flex-direction: row-reverse; }
      .pl .nm { font-size: calc(22px * var(--s)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pl .bv { font-size: calc(24px * var(--s)); font-weight: 900; font-variant-numeric: tabular-nums; }
      .pl .dm { font-size: calc(13px * var(--s)); font-weight: 900; letter-spacing: 0.12em; color: #ff5a6a; }
      .pl .bar { margin-top: calc(5px * var(--s)); height: calc(8px * var(--s)); border-radius: calc(4px * var(--s)); background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .pl .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--tc);
        transition: width 0.2s linear;
      }
      .boosts.c1 .pl .bar i { margin-left: auto; background: var(--tc); }
      .pl.ss .bar i { background: color-mix(in srgb, var(--tc) 55%, white 45%); }

      /* ---------------- Joueur suivi ---------------- */
      .target {
        position: absolute;
        left: 50%;
        bottom: calc(28px * var(--s));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: calc(18px * var(--s));
        padding: calc(12px * var(--s)) calc(22px * var(--s)) calc(12px * var(--s)) calc(14px * var(--s));
        background: var(--panel);
        border-radius: calc(16px * var(--s));
        border-top: calc(4px * var(--s)) solid var(--tc);
        box-shadow: 0 calc(10px * var(--s)) calc(30px * var(--s)) rgba(0, 0, 0, 0.45);
        transition: opacity 0.3s;
      }
      .target .ring { width: calc(82px * var(--s)); height: calc(82px * var(--s)); position: relative; flex: none; }
      .target .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .target .ring circle { fill: none; stroke-width: 9; }
      .target .ring .bg { stroke: rgba(255, 255, 255, 0.1); }
      .target .ring .fg { stroke: var(--tc); stroke-linecap: round; transition: stroke-dasharray 0.2s linear; }
      .target .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(30px * var(--s)); font-weight: 900; }
      .target .who { display: flex; flex-direction: column; min-width: calc(180px * var(--s)); }
      .target .who b { font-size: calc(34px * var(--s)); font-weight: 900; line-height: 1.05; white-space: nowrap; }
      .target .who span { font-size: calc(15px * var(--s)); font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: color-mix(in srgb, var(--tc) 60%, white 40%); }
      .target .st { display: flex; gap: calc(6px * var(--s)); }
      .target .st div {
        min-width: calc(62px * var(--s));
        padding: calc(6px * var(--s)) calc(8px * var(--s));
        border-radius: calc(8px * var(--s));
        background: rgba(255, 255, 255, 0.05);
        text-align: center;
      }
      .target .st b { display: block; font-size: calc(26px * var(--s)); font-weight: 900; line-height: 1; }
      .target .st i { font-style: normal; font-size: calc(11px * var(--s)); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); }

      /* ---------------- But ---------------- */
      .goal {
        position: absolute;
        left: 50%;
        top: calc(150px * var(--s));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: calc(22px * var(--s));
        padding: calc(10px * var(--s)) calc(30px * var(--s)) calc(10px * var(--s)) calc(10px * var(--s));
        background: var(--panel);
        border-radius: calc(14px * var(--s));
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .goal.show { animation: goalIn 5.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
      @keyframes goalIn {
        0% { opacity: 0; transform: translateX(-50%) scaleX(0.2); }
        8% { opacity: 1; transform: translateX(-50%) scaleX(1.04); }
        12% { transform: translateX(-50%) scaleX(1); }
        88% { opacity: 1; transform: translateX(-50%) scaleX(1); }
        100% { opacity: 0; transform: translateX(-50%) translateY(calc(-10px * var(--s))); }
      }
      .goal .tag {
        padding: calc(8px * var(--s)) calc(22px * var(--s));
        border-radius: calc(10px * var(--s));
        background: var(--tc);
        font-size: calc(46px * var(--s));
        font-weight: 900;
        font-style: normal;
        letter-spacing: 0.04em;
        line-height: 1;
        box-shadow: none;
      }
      .goal .info b { display: block; font-size: calc(34px * var(--s)); font-weight: 900; line-height: 1.05; }
      .goal .info span { font-size: calc(18px * var(--s)); font-weight: 700; color: rgba(255, 255, 255, 0.7); }
      .goal .spd { font-size: calc(38px * var(--s)); font-weight: 900; }
      .goal .spd small { font-size: 0.45em; margin-left: 0.2em; color: rgba(255, 255, 255, 0.6); }

      /* ---------------- Statfeed ---------------- */
      .feed { position: absolute; left: calc(24px * var(--s)); bottom: calc(28px * var(--s)); display: flex; flex-direction: column-reverse; gap: calc(8px * var(--s)); }
      .feed .it {
        display: flex;
        align-items: center;
        gap: calc(10px * var(--s));
        padding: calc(7px * var(--s)) calc(14px * var(--s));
        background: var(--panel);
        border-radius: calc(10px * var(--s));
        border-left: calc(5px * var(--s)) solid var(--tc);
        font-size: calc(19px * var(--s));
        font-weight: 700;
        animation: feedIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .feed .it.out { opacity: 0; transform: translateX(calc(-30px * var(--s))); transition: 0.4s; }
      .feed .it em { font-style: normal; font-weight: 900; font-size: 0.8em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
      .feed .it .p0 { color: color-mix(in srgb, var(--blue) 55%, white 45%); }
      .feed .it .p1 { color: color-mix(in srgb, var(--orange) 55%, white 45%); }
      @keyframes feedIn { from { opacity: 0; transform: translateX(calc(-30px * var(--s))); } }

      /* ---------------- Tableau de fin de partie ---------------- */
      .post {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(3, 5, 10, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      .post.show { opacity: 1; }
      .post .card {
        width: calc(1240px * var(--s));
        background: var(--panel);
        border-radius: calc(22px * var(--s));
        overflow: hidden;
        box-shadow: 0 calc(20px * var(--s)) calc(60px * var(--s)) rgba(0, 0, 0, 0.6);
        transform: translateY(calc(20px * var(--s)));
        transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      .post.show .card { transform: none; }
      .post .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
      .post .head .tm { padding: calc(22px * var(--s)) calc(30px * var(--s)); background: var(--tc); }
      .post .head .tm.c1 { text-align: right; }
      .post .head .tm b { display: block; font-size: calc(40px * var(--s)); font-weight: 900; text-transform: uppercase; }
      .post .head .tm .pips { margin-top: calc(8px * var(--s)); }
      .post .head .tm.c1 .pips { justify-content: flex-end; }
      .post .head .fs { padding: 0 calc(34px * var(--s)); text-align: center; }
      .post .head .fs b { font-size: calc(76px * var(--s)); font-weight: 900; line-height: 1; }
      .post .head .fs i { display: block; font-style: normal; font-size: calc(15px * var(--s)); font-weight: 800; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.6); }
      .post .win {
        text-align: center;
        padding: calc(14px * var(--s));
        font-size: calc(30px * var(--s));
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
        border-bottom: 1px solid var(--line);
      }
      .post table { width: 100%; border-collapse: collapse; }
      .post th {
        font-size: calc(13px * var(--s));
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        padding: calc(10px * var(--s)) calc(12px * var(--s));
        text-align: center;
      }
      .post th:first-child, .post td:first-child { text-align: left; padding-left: calc(30px * var(--s)); }
      .post td { padding: calc(9px * var(--s)) calc(12px * var(--s)); text-align: center; font-size: calc(24px * var(--s)); font-weight: 800; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
      .post td:first-child { border-left: calc(6px * var(--s)) solid var(--tc); font-weight: 800; }
      .post tr.best td { background: rgba(255, 211, 90, 0.07); }
      .post .mvp { margin-left: calc(10px * var(--s)); font-size: calc(13px * var(--s)); padding: calc(2px * var(--s)) calc(8px * var(--s)); border-radius: calc(6px * var(--s)); background: var(--gold); color: #1b1000; font-weight: 900; letter-spacing: 0.1em; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div class="root" id="root">
      <div class="boosts c0" id="b0"></div>
      <div class="boosts c1" id="b1"></div>

      <div class="bug" id="bug">
        <div class="row">
          <div class="team c0"><span class="tname" id="n0"></span><img class="logo hide" id="l0" alt="" /></div>
          <div class="score c0" id="s0">0</div>
          <div class="clock" id="clock"><b id="clk">5:00</b><i id="clkSub"></i></div>
          <div class="score c1" id="s1">0</div>
          <div class="team c1"><span class="tname" id="n1"></span><img class="logo hide" id="l1" alt="" /></div>
        </div>
        <div class="sub" id="sub">
          <div class="pips c0" id="p0"></div>
          <span class="mid" id="subTxt"></span>
          <div class="pips c1" id="p1"></div>
        </div>
      </div>

      <div class="goal" id="goal"></div>
      <div class="target" id="target"></div>
      <div class="feed" id="feed"></div>
      <div class="post" id="post"><div class="card" id="postCard"></div></div>
    </div>
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/client.js"></script>
    <script src="/static/overlay/caster.js"></script>
  </body>
</html>
