<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Bannière GitHub (1280×400) : même langage que l'app — graphite mat, plaques d'habillage télé à coins coupés,
   couleurs réservées au sens (victoire, défaite, équipes). Rendu : tools/shot.js → docs/images/banner.png */
@font-face { font-family: 'Archivo'; font-weight: 100 900; font-stretch: 62% 125%; src: url('../web/assets/fonts/archivo-latin-standard-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'BC'; font-weight: 800; src: url('../web/assets/fonts/barlow-condensed-800-normal.woff2'); }
@font-face { font-family: 'BC'; font-weight: 600; src: url('../web/assets/fonts/barlow-condensed-600-normal.woff2'); }
:root { --desk:#121417; --plate:#202329; --line:#353941; --text:#e7e4de; --muted:#9297a1; --faint:#6b707a;
  --win:#4cc38a; --loss:#e5534b; --blue:#4c8df6; --orange:#f08a3c; }
html,body{margin:0;width:1280px;height:400px;overflow:hidden;background:var(--desk);color:var(--text);font-family:Archivo,sans-serif}
body{position:relative}
/* barre des deux équipes, comme sous le logo */
.teams{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex}
.teams i{flex:1;background:var(--blue)}.teams i+i{background:var(--orange)}

.id{position:absolute;left:80px;top:92px;display:flex;align-items:center;gap:34px}
.id img{width:136px;height:136px;display:block}
h1{margin:0;font-weight:800;font-stretch:118%;font-size:92px;line-height:.92;letter-spacing:-.01em}
.id p{margin:14px 0 0;font-weight:420;font-size:25px;color:var(--muted);max-width:400px;line-height:1.3}
.facts{position:absolute;left:80px;bottom:58px;display:flex;font-size:17px;font-weight:520;color:var(--faint)}
.facts span{padding:0 18px;border-left:1px solid var(--line)}.facts span:first-child{padding-left:0;border:0}

/* le compteur tel qu'il apparaît en stream */
.ov{position:absolute;right:80px;top:118px}
.tag{display:inline-block;background:var(--text);color:var(--plate);font-weight:700;font-stretch:110%;font-size:14px;padding:5px 12px 4px}
.plate{position:relative;display:flex;align-items:stretch;height:118px;padding:0 10px;isolation:isolate}
.plate::after{content:'';position:absolute;inset:0;z-index:-1;background:var(--plate);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.c{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 18px;min-width:72px}
.c+.c{box-shadow:inset 1px 0 0 var(--line)}
.c b{font-family:BC;font-weight:800;font-size:66px;line-height:.9}
.c small{margin-top:6px;font-size:14px;font-weight:560;color:var(--muted)}
.c .w{color:var(--win)}.c .l{color:var(--loss)}
.c .m{font-size:48px;line-height:1.1}
</style></head><body>
<div class="id">
  <img src="../build/icon.png" alt="">
  <div><h1>RL-UI</h1><p>Win and loss tracker with stream overlays for Rocket League</p></div>
</div>
<div class="facts"><span>Real MMR</span><span>OBS and Streamlabs</span><span>Caster mode</span><span>No mods</span></div>
<div class="ov">
  <span class="tag">Session</span>
  <div class="plate">
    <div class="c"><b class="w">12</b><small>Wins</small></div>
    <div class="c"><b class="l">5</b><small>Losses</small></div>
    <div class="c"><b class="m">71%</b><small>Winrate</small></div>
    <div class="c"><b class="m w">+37</b><small>MMR</small></div>
  </div>
</div>
<div class="teams"><i></i><i></i></div>
</body></html>
