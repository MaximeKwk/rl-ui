<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RL-UI 2 — film</title>
<style>
/* Film de présentation de RL-UI 2 (1920 × 1080, 49 s). ?lang=fr|en · ?play=1 pour le regarder dans un navigateur.
   Tout est piloté par le temps : render.js fige chaque image avec setTime(t), la capture et l'envoie à ffmpeg.
   - les animations CSS ont pour délai (--at) leur instant dans le film : setTime règle leur temps courant ;
   - ce qui change en cours de route (chiffres, curseur, overlays) est calculé à partir de t, dans le script du bas.
   Identité V2 : turquoise et violet, Unbounded (titres, chiffres) et Onest (texte), le coin coupé du logo.
   Les overlays montrés sont les vrais : dessinés par web/shared/compose.js à partir des modèles de l'éditeur. */
@font-face { font-family: 'Unbounded'; font-weight: 200 900; src: url('../../web/assets/fonts/unbounded-latin-wght-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Onest'; font-weight: 100 900; src: url('../../web/assets/fonts/onest-latin-wght-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url('../../web/assets/fonts/barlow-condensed-600-normal.woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('../../web/assets/fonts/barlow-condensed-700-normal.woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url('../../web/assets/fonts/barlow-condensed-800-normal.woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 900; src: url('../../web/assets/fonts/barlow-condensed-900-normal.woff2'); }
:root {
  --desk: #0e1316; --panel: #1a2226; --raised: #243035; --line: #2a353a; --line-2: #3a474d; --text: #e8eeef; --muted: #97a6aa; --faint: #6f8186;
  --accent: #2fd2c6; --on-accent: #06201e; --violet: #a996ff; --win: #8bd95a; --loss: #f2685f; --ot: #e8a33d;
  --num: 'Unbounded', sans-serif; --ui: 'Onest', sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --back: cubic-bezier(0.2, 0.9, 0.3, 1.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--desk); color: var(--text); font-family: var(--ui); }
#film { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
.scene { position: absolute; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; }

/* ---------- animations : chacune part à l'instant --at du film */
@keyframes rise { from { opacity: 0; transform: translateY(46px); } }
@keyframes fall { from { opacity: 0; transform: translateY(-46px); } }
@keyframes left { from { opacity: 0; transform: translateX(-90px); } }
@keyframes right { from { opacity: 0; transform: translateX(90px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes line { from { transform: translateY(108%); } }
@keyframes gone { to { opacity: 0; } }
@keyframes goneUp { to { opacity: 0; transform: translateY(-40px); } }
.a-rise { animation: rise 0.6s var(--ease) var(--at) both; }
.a-fall { animation: fall 0.6s var(--ease) var(--at) both; }
.a-left { animation: left 0.6s var(--ease) var(--at) both; }
.a-right { animation: right 0.6s var(--ease) var(--at) both; }
.a-fade { animation: fade 0.5s ease var(--at) both; }
.a-pop { animation: pop 0.5s var(--back) var(--at) both; }
/* ligne de titre qui monte derrière un cache */
.ln { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
.ln > span { display: inline-block; animation: line 0.7s var(--ease) var(--at) both; }
/* sortie d'un élément à l'instant --out (en plus de son entrée) */
.x-gone { animation-name: var(--in, fade), gone; animation-duration: 0.6s, 0.35s; animation-timing-function: var(--ease), ease-in; animation-delay: var(--at), var(--out); animation-fill-mode: both, forwards; }

/* ---------- fond : deux lueurs qui dérivent lentement, pendant tout le film */
/* (des dégradés plutôt qu'un flou : la lueur s'éteint en douceur, sans anneaux à la compression) */
.glow { position: absolute; border-radius: 50%; }
.glow.a { left: -620px; top: -700px; width: 1800px; height: 1650px; background: radial-gradient(closest-side, rgba(21, 122, 116, 0.62), rgba(21, 122, 116, 0.28) 45%, rgba(21, 122, 116, 0) 100%); animation: driftA 49s linear 0s both; }
.glow.b { right: -700px; bottom: -800px; width: 1950px; height: 1800px; background: radial-gradient(closest-side, rgba(88, 70, 178, 0.6), rgba(88, 70, 178, 0.27) 45%, rgba(88, 70, 178, 0) 100%); animation: driftB 49s linear 0s both; }
/* un grain fixe, très léger : il casse les aplats des dégradés sombres */
.noise { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
@keyframes driftA { to { transform: translate(260px, 160px); } }
@keyframes driftB { to { transform: translate(-300px, -140px); } }
.grain { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px); background-size: 96px 96px; }

/* ---------- transition : le coin coupé balaie l'écran, turquoise puis violet */
.wipe { position: absolute; left: 0; top: 0; width: 3400px; height: 1080px; z-index: 50; transform: translateX(-3500px); clip-path: polygon(0 0, calc(100% - 540px) 0, 100% 100%, 540px 100%); animation: wipe 0.9s cubic-bezier(0.7, 0, 0.3, 1) var(--at) both; }
.wipe.t { background: var(--accent); }
.wipe.v { background: var(--violet); animation-delay: calc(var(--at) + 0.09s); z-index: 49; }
@keyframes wipe { from { transform: translateX(-3500px); } to { transform: translateX(2000px); } }

/* ---------- pièces communes */
h1, h2, p { margin: 0; }
.title { font-family: var(--num); font-weight: 700; font-size: 104px; line-height: 1.06; letter-spacing: -0.02em; }
.title.s { font-size: 82px; }
.sub { font-size: 40px; line-height: 1.3; color: var(--muted); font-weight: 450; }
.sub b { color: var(--text); font-weight: 600; }
.tq { color: var(--accent); } .vi { color: var(--violet); } .w { color: var(--win); } .l { color: var(--loss); } .o { color: var(--ot); }
.chip { display: inline-flex; align-items: center; gap: 14px; height: 62px; padding: 0 26px; border-radius: 14px; background: var(--panel); border: 1.5px solid var(--line-2); font-size: 28px; font-weight: 600; white-space: nowrap; }
.chip.brand { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); font-weight: 700; }
.chip.vio { background: var(--violet); color: #17103a; border: 0; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); font-weight: 700; }
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.kick { font-family: var(--num); font-weight: 600; font-size: 24px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
/* faux fond de match, comme dans les aperçus de l'app */
.pitch { position: absolute; inset: 0; background: radial-gradient(1500px 760px at 18% 112%, rgba(24, 115, 255, 0.38), transparent 60%), radial-gradient(1500px 760px at 82% 112%, rgba(255, 138, 42, 0.32), transparent 60%), linear-gradient(180deg, #1b2438 0%, #0b1020 55%, #070a12 100%); }
.pitch::after { content: ''; position: absolute; left: -40%; right: -40%; bottom: -8%; height: 62%; background-image: linear-gradient(rgba(255, 255, 255, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, 0.07) 2px, transparent 2px); background-size: 150px 150px; transform: perspective(900px) rotateX(64deg); transform-origin: 50% 100%; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%); }
.pitch.mini { background: radial-gradient(700px 330px at 16% 118%, rgba(24, 115, 255, 0.4), transparent 62%), radial-gradient(700px 330px at 84% 118%, rgba(255, 138, 42, 0.34), transparent 62%), linear-gradient(180deg, #1b2438 0%, #0b1020 60%, #070a12 100%); }
.pitch.mini::after { display: none; }
/* fenêtre de l'app : une vraie capture, dans un cadre au coin coupé */
.winbox { position: absolute; filter: drop-shadow(0 50px 90px rgba(0, 0, 0, 0.6)); }
.win { width: 100%; height: 100%; padding: 2px; background: var(--line-2); border-radius: 22px; clip-path: polygon(0 0, calc(100% - 46px) 0, 100% 46px, 100% 100%, 0 100%); }
.win > div { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #12181b; clip-path: polygon(0 0, calc(100% - 45px) 0, 100% 45px, 100% 100%, 0 100%); position: relative; }
.win img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
/* curseur */
.cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 30; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5)); }
.ring { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 5px solid var(--violet); opacity: 0; z-index: 29; }
/* compositions (compose.js) : toujours posées dans un hôte à leur taille, mis à l'échelle par CSS */
.cmph { position: absolute; transform-origin: 0 0; }
.cmph .cmp { position: absolute; left: 0; top: 0; }

/* ---------- 1. ouverture */
#s1 .mark { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -230px 0 0 -150px; animation: markLeft 0.8s var(--ease) 1.5s both; }
@keyframes markLeft { to { transform: translateX(-430px); } }
#s1 .mark svg { width: 100%; height: 100%; overflow: visible; }
#s1 .frame { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linejoin: round; stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw 1s cubic-bezier(0.6, 0, 0.2, 1) 0.25s both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
#s1 .ball { fill: var(--violet); transform-box: fill-box; transform-origin: center; animation: drop 0.75s cubic-bezier(0.3, 1.5, 0.5, 1) 0.95s both; }
@keyframes drop { 0% { opacity: 0; transform: translate(60px, -220px) scale(0.6); } 30% { opacity: 1; } 100% { transform: none; } }
#s1 .word { position: absolute; left: 50%; top: 50%; margin: -196px 0 0 -210px; font-family: var(--num); font-weight: 800; font-size: 210px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
#s1 .word .ln > span { animation-duration: 0.8s; }
#s1 .tag { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-size: 46px; color: var(--muted); font-weight: 450; }
#s1 .v2 { position: absolute; left: 50%; top: 770px; transform: translateX(-50%); }
#s1 .v2 .chip { height: 58px; font-family: var(--num); font-size: 24px; letter-spacing: 0.08em; }

/* ---------- 2. ce que fait l'app, en trois mots */
#s2 .words { position: absolute; left: 150px; top: 170px; }
#s2 .words .title { font-size: 150px; line-height: 1.04; }
#s2 .sub { position: absolute; left: 156px; top: 720px; font-size: 46px; }
#s2 .grid { position: absolute; right: 150px; top: 196px; display: grid; grid-template-columns: repeat(4, 128px); gap: 22px; }
#s2 .grid i { height: 128px; border-radius: 26px; display: grid; place-items: center; font: 800 54px var(--num); font-style: normal; animation: pop 0.45s var(--back) var(--at) both; }
#s2 .grid i.W { background: var(--win); color: #0f2406; } #s2 .grid i.L { background: var(--loss); color: #2a0b09; }
#s2 .grid i.O { box-shadow: inset 0 9px 0 var(--ot); }
#s2 .total { position: absolute; right: 150px; top: 690px; width: 578px; display: flex; align-items: baseline; justify-content: space-between; font-family: var(--num); font-weight: 800; }
#s2 .total b { font-size: 132px; line-height: 1; }
#s2 .total span { font-size: 60px; color: var(--faint); font-weight: 500; }

/* ---------- 3. en direct : le compteur et les alertes */
#s3 .cap { position: absolute; left: 110px; bottom: 96px; }
#s3 .cap .title { font-size: 76px; }
#s3 .cap .kick { margin-bottom: 18px; display: flex; align-items: center; gap: 14px; }
#s3 .cap .kick::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--loss); }
#s3 .flash { position: absolute; left: 132px; top: 130px; width: 1028px; height: 138px; border-radius: 26px; background: #fff; opacity: 0; mix-blend-mode: overlay; pointer-events: none; }
.alert { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: translateY(-70px); }

/* ---------- 4. l'app : accueil, puis stats */
.col { position: absolute; left: 110px; top: 250px; width: 600px; }
.col .title { font-size: 62px; white-space: nowrap; }
.col .sub { margin-top: 30px; font-size: 34px; }
.col ul { list-style: none; margin: 44px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.col li { display: flex; align-items: center; gap: 18px; font-size: 31px; font-weight: 550; }
.col li::before { content: ''; flex: none; width: 34px; height: 34px; background: var(--accent); clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%); border-radius: 8px; }
.col li.v::before { background: var(--violet); }

/* ---------- 5. l'éditeur de thèmes */
#s5a .big { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
#s5a .big .title { font-size: 128px; }
#s5a .big .chip { margin-bottom: 44px; }
#s5 .stage { position: absolute; left: 560px; top: 250px; width: 1210px; height: 480px; border-radius: 28px; overflow: hidden; border: 2px solid var(--line-2); }
#s5 .pal { position: absolute; left: 150px; top: 250px; width: 330px; display: flex; flex-direction: column; gap: 16px; }
#s5 .pal .chip { height: 74px; font-size: 30px; justify-content: flex-start; }
#s5 .pal svg { width: 34px; height: 34px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#s5 .sel { position: absolute; border: 4px solid var(--violet); opacity: 0; z-index: 5; }
#s5 .sel i { position: absolute; width: 18px; height: 18px; margin: -11px 0 0 -11px; background: #fff; border: 4px solid var(--violet); border-radius: 4px; }
#s5 .swatches { position: absolute; left: 560px; top: 790px; display: flex; align-items: center; gap: 22px; }
#s5 .swatches .lbl { width: 170px; font-size: 30px; color: var(--muted); margin-right: 8px; }
#s5 .sw { width: 150px; height: 74px; border-radius: 16px; border: 2px solid var(--line-2); display: flex; overflow: hidden; }
#s5 .sw b { flex: 1; }
#s5 .sw.on { border-color: #fff; box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18); }
#s5 .cap { position: absolute; left: 150px; top: 96px; right: 150px; display: flex; align-items: baseline; gap: 34px; }
#s5 .cap .title { font-size: 72px; white-space: nowrap; }
#s5 .cap .sub { white-space: nowrap; }
#s5 .names { position: absolute; left: 560px; top: 790px; display: flex; gap: 16px; }
#s5 .names .chip { height: 74px; font-size: 32px; padding: 0 30px; }
#s5 .names .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- 6. la galerie */
#s6 .toast { position: absolute; right: 150px; top: 880px; z-index: 20; }
#s6 .toast .chip { height: 78px; font-size: 32px; background: #173117; border-color: var(--win); color: #d9f7c8; }
#s6 .url { margin-top: 44px; }
#s6 .url .chip { font-family: var(--num); font-size: 26px; height: 70px; }

/* ---------- 7. Boost et caster */
#s7 .col { top: 300px; }
#s7b .cap { position: absolute; left: 0; right: 0; bottom: 250px; display: flex; justify-content: center; }
#s7b .cap .chip { height: 82px; font-size: 36px; padding: 0 36px; }
.gaugebox { position: absolute; transform-origin: 100% 100%; right: 110px; bottom: 100px; width: 480px; height: 320px; transform: scale(2.4); }

/* ---------- 8. et aussi */
#s8 .title { position: absolute; left: 150px; top: 180px; font-size: 100px; }
#s8 .wall { position: absolute; left: 150px; top: 370px; right: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 30px; }
#s8 .wall .chip { height: 122px; padding: 0 46px; font-size: 48px; border-radius: 24px; }
#s8 .wall .chip.brand, #s8 .wall .chip.vio { clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%); }

/* ---------- 9. fin */
#s9 .mark { position: absolute; left: 50%; top: 170px; width: 230px; height: 230px; margin-left: -115px; animation: pop 0.6s var(--back) 45.05s both; }
#s9 .mark svg { width: 100%; height: 100%; overflow: visible; }
#s9 .mark .frame { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linejoin: round; }
#s9 .mark .ball { fill: var(--violet); transform-box: fill-box; transform-origin: center; animation: bounce 1.1s cubic-bezier(0.3, 1.6, 0.5, 1) 45.2s both; }
@keyframes bounce { 0% { transform: translate(40px, -160px); opacity: 0; } 25% { opacity: 1; } 100% { transform: none; } }
#s9 .word { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-family: var(--num); font-weight: 800; font-size: 170px; line-height: 1; letter-spacing: -0.03em; }
#s9 .free { position: absolute; left: 0; right: 0; top: 670px; text-align: center; font-size: 50px; color: var(--muted); }
#s9 .free b { color: var(--text); font-weight: 600; }
#s9 .links { position: absolute; left: 0; right: 0; top: 800px; display: flex; justify-content: center; gap: 26px; }
#s9 .links .chip { height: 84px; padding: 0 38px; font-family: var(--num); font-size: 28px; }
</style></head>
<body>
<div id="film">
  <div class="glow a"></div><div class="glow b"></div><div class="grain"></div>
  <div class="noise" id="noise"></div>

  <!-- 1. ouverture : le logo se trace, la balle tombe à sa place -->
  <section class="scene" id="s1" data-in="0" data-out="3.8">
    <div class="mark"><svg viewBox="0 0 100 100"><path class="frame" d="M27 9H47L91 53V73A18 18 0 0 1 73 91H27A18 18 0 0 1 9 73V27A18 18 0 0 1 27 9Z" /><circle class="ball" cx="85" cy="15" r="13" /></svg></div>
    <div class="word"><span class="ln"><span style="--at:1.55s">RL-UI</span></span></div>
    <p class="tag a-rise" style="--at:2.2s" data-t="tagline"></p>
    <div class="v2"><span class="chip vio a-pop" style="--at:2.65s" data-t="v2"></span></div>
  </section>

  <!-- 2. trois mots -->
  <section class="scene" id="s2" data-in="3.8" data-out="7.8">
    <div class="words">
      <h1 class="title w"><span class="ln"><span style="--at:4.0s" data-t="wins"></span></span></h1>
      <h1 class="title l"><span class="ln"><span style="--at:4.5s" data-t="losses"></span></span></h1>
      <h1 class="title o"><span class="ln"><span style="--at:5.0s">Overtime.</span></span></h1>
    </div>
    <p class="sub a-rise" style="--at:5.7s" data-t="counted"></p>
    <div class="grid" id="grid"></div>
    <div class="total a-fade" style="--at:4.2s"><b class="w" id="gw">0</b><span>–</span><b class="l" id="gl">0</b></div>
  </section>

  <!-- 3. en direct : le vrai compteur et les vraies alertes, sur un faux match -->
  <section class="scene" id="s3" data-in="7.8" data-out="15.8">
    <div class="pitch"></div>
    <div class="cmph a-left" id="ctr" style="--at:8.1s; left:104px; top:40px; width:1000px; height:220px; transform:scale(1.6)"></div>
    <div class="flash" id="flash"></div>
    <div class="alert x-gone" id="al1" style="--in:alertIn; --at:9.2s; --out:11.05s"></div>
    <div class="alert x-gone" id="al2" style="--in:alertIn; --at:11.4s; --out:13.15s"></div>
    <div class="alert x-gone" id="al3" style="--in:alertIn; --at:13.5s; --out:15.45s"></div>
    <div class="cap">
      <div class="kick a-fade" style="--at:8.3s" data-t="live"></div>
      <h2 class="title x-gone" style="--in:rise; --at:8.4s; --out:11.2s; position:absolute; left:0; bottom:0; white-space:nowrap" data-t="cap1"></h2>
      <h2 class="title a-rise" style="--at:11.5s; white-space:nowrap" data-t="cap2"></h2>
    </div>
  </section>

  <!-- 4. l'app : accueil -->
  <section class="scene" id="s4" data-in="15.8" data-out="18.8">
    <div class="col">
      <div class="kick a-fade" style="--at:16.2s" data-t="k4"></div>
      <h2 class="title" style="margin-top:22px"><span class="ln"><span style="--at:16.25s" data-t="t4a"></span></span><span class="ln"><span style="--at:16.4s" data-t="t4b"></span></span></h2>
      <ul>
        <li class="a-left" style="--at:16.9s" data-t="b4a"></li>
        <li class="a-left v" style="--at:17.15s" data-t="b4b"></li>
        <li class="a-left" style="--at:17.4s" data-t="b4c"></li>
      </ul>
    </div>
    <div class="winbox" id="w4" style="left:730px; top:112px; width:1370px; height:856px"><div class="win"><div><img data-shot="app-home" alt=""></div></div></div>
  </section>
  <!-- 4 bis. les stats -->
  <section class="scene" id="s4b" data-in="18.8" data-out="21.8">
    <div class="winbox" id="w4b" style="left:-180px; top:112px; width:1370px; height:856px"><div class="win"><div><img data-shot="app-stats" alt=""></div></div></div>
    <div class="col" style="left:1250px; width:620px">
      <div class="kick a-fade" style="--at:19.0s" data-t="k4s"></div>

  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = T[el.dataset.t];

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const out3 = (x) => 1 - Math.pow(1 - x, 3);
  // valeur d'une piste [[t, v…], …] à l'instant t (interpolée, adoucie)
  function track(points, t) {
    if (t <= points[0][0]) return points[0].slice(1);
    for (let i = 1; i < points.length; i++) {
      if (t <= points[i][0]) {
        const a = points[i - 1];
        const b = points[i];
        const k = ease((t - a[0]) / (b[0] - a[0]));
        return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
      }
    }
    return points[points.length - 1].slice(1);
  }
  const mount = (id, comp, opts = {}) => C.mount($(id), comp, { animate: false, ...opts });
  // Pose l'hôte d'une composition pour que ce qu'elle dessine (hors éléments de match) tienne, centré, dans un cadre w × h
  function fitHost(id, comp, w, h, max = 1.6) {
    const list = comp.elements.filter((e) => !e.hidden && e.when === 'always');
    const x0 = Math.min(...list.map((e) => e.x)), y0 = Math.min(...list.map((e) => e.y));
    const bw = Math.max(...list.map((e) => e.x + e.w)) - x0, bh = Math.max(...list.map((e) => e.y + e.h)) - y0;
    const k = Math.min(w / bw, h / bh, max);
    const host = $(id);
    const left = (host.parentElement.clientWidth || 1210) / 2 - (x0 + bw / 2) * k;
    const top = (host.parentElement.clientHeight || 480) / 2 - (y0 + bh / 2) * k;
    Object.assign(host.style, { left: `${left}px`, top: `${top}px`, width: `${comp.width}px`, height: `${comp.height}px`, transform: `scale(${k})` });
    return { left, top, k };
  }

  // grain : une tuile de bruit tirée une fois (toujours la même), répétée sur toute l'image
  {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 256;
    const g = cv.getContext('2d');
    const im = g.createImageData(256, 256);
    let seed = 7;
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = rnd() < 0.5 ? 0 : 255;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = Math.round(rnd() * 9);
    }
    g.putImageData(im, 0, 0);
    $('noise').style.backgroundImage = `url(${cv.toDataURL()})`;
  }

  // ------------------------------------------------------------------ 2. la grille des parties
  const SEQ = 'WLWWLWWLWLWW'.split('');
  $('grid').innerHTML = SEQ.map((r, i) => `<i class="${r}${i === 3 || i === 9 ? ' O' : ''}" style="--at:${(4.15 + i * 0.25).toFixed(2)}s">${r === 'W' ? tr('lbl.w') : tr('lbl.l')}</i>`).join('');

  // ------------------------------------------------------------------ 3. compteur et alertes
  const counter = C.clean(starters.starter('signature', tr));
  const ctr = mount('ctr', counter);
  const alertComp = C.clean(starters.overlayStarter('alerts', tr));
  const session = (o) => ({ ...C.sample('idle', tr), ...o });
  // (un texte « ajusté » se mesure à l'écran : les vues d'une scène sont remises à jour tant qu'elle est affichée)
  const REFRESH = [];
  const alertView = (id, type, o) => {
    const v = mount(id, alertComp);
    const a = C.sampleAlert(type, tr);
    Object.assign(a.data, o);
    const d = { ...session(o.session), ...C.alertFields(a, tr) };
    REFRESH.push([7.8, 15.8, () => v.update(d)]);
  };
  alertView('al1', 'win', { wins: 12, losses: 5, streak: 3, n: 3, scoreFor: 3, scoreAgainst: 1, session: { wins: 12, losses: 5 } });
  alertView('al2', 'overtime', { wins: 12, losses: 5, streak: 3, session: { wins: 12, losses: 5 } });
  alertView('al3', 'ot_win', { wins: 13, losses: 5, streak: 4, scoreFor: 3, scoreAgainst: 2, session: { wins: 13, losses: 5 } });
  // état du compteur au fil de la scène
  const STEPS = [
    { t: 0, d: { wins: 11, losses: 5, played: 16, winRate: 69, streak: 2, mmrDelta: 33, inMatch: true, mode: tr('cmp.sampleMode'), clock: '0:07', score: '2 - 1' } },
    { t: 9.3, d: { wins: 12, losses: 5, played: 17, winRate: 71, streak: 3, mmrDelta: 45 } },
    { t: 11.4, d: { wins: 12, losses: 5, played: 17, winRate: 71, streak: 3, mmrDelta: 45, inMatch: true, overtime: true, mode: tr('cmp.sampleMode'), clock: '+0:00', score: '2 - 2' } },
    { t: 13.6, d: { wins: 13, losses: 5, played: 18, winRate: 72, streak: 4, mmrDelta: 57 } },
  ];

  // ------------------------------------------------------------------ 5. l'éditeur
  const ICON = { 0: '<rect x="4" y="6" width="16" height="12" rx="3" />', 1: '<path d="M6 7h12M12 7v11" />', 2: '<path d="M5 17l4-10 4 10M6.500 13.500h5M16 9v8M19 12v5" />', 3: '<rect x="4" y="5" width="16" height="14" rx="2" /><path d="M4 16l5-4 4 3 3-2 4 3" />', 4: '<path d="M5 17a8 8 0 1 1 14 0" />' };
  $('pal').innerHTML = T.pal.map((n, i) => `<span class="chip a-left" style="--at:${(23.7 + i * 0.08).toFixed(2)}s"><svg viewBox="0 0 24 24">${ICON[i]}</svg>${n}</span>`).join('');
  const ed0 = mount('ed0', counter);
  ed0.update(session({}));
  const E = fitHost('ed0', counter, 1060, 340, 1.65);
  // chaque élément du compteur arrive à son tour, dans l'ordre des calques
  counter.elements.forEach((e, i) => {
    const n = ed0.nodes.get(e.id);
    if (e.when !== 'always') return;
    n.style.animation = `pop 0.42s var(--back) ${(24.05 + i * 0.055).toFixed(3)}s both`;

  const themes = window.PROMO_THEMES;
  const order = ['neon-night', 'arcade', 'daylight'].map((id) => themes.find((t) => t.id === id));
  order.forEach((th, i) => {
    const host = $(`ed${i + 1}`);

  $('names').innerHTML = ['Signature', ...order.map((t) => (LANG === 'fr' ? t.fr : t.name))].map((n, i) => `<span class="chip" data-n="${i}">${n}</span>`).join('');
  // l'élément que le curseur déplace : le winrate (valeur et sa légende)
  const dragBox = counter.elements.find((e) => e.type === 'value' && e.bind === 'winRate');
  const dragged = counter.elements.filter((e) => (e.type === 'value' || e.type === 'text') && e.when === 'always' && e.x === dragBox.x && e.y >= dragBox.y && e.y - dragBox.y < 70);
  const dragNodes = dragged.map((e) => ed0.nodes.get(e.id));
  const DRAG = [0, -14]; // déplacement, en pixels de la toile
  const PALETTES = [['#8bd95a', '#f2685f', '#e8a33d'], ['#3dffd0', '#ff4fa8', '#ffe04d'], ['#5b9bff', '#f08a3c', '#ffffff']];
  const mix = (a, b, k) => `#${[1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - k) + parseInt(b.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join('')}`;

  // ------------------------------------------------------------------ 7. Boost et caster
  const boostComp = C.clean(starters.overlayStarter('boost', tr));
  $('boost').appendChild(C.gauge(boostComp, '#ff7f22'));
  const boost = mount('boost', boostComp);
  const casterComp = C.clean(starters.overlayStarter('caster', tr));

    // une partie d'exemple qui vit : le chrono descend, les boosts bougent, puis le but
    const d = C.sampleCaster(t >= 40.4 ? 'goal' : 'live', tr);
    const k = t - 39.2;
    d.roster.forEach((list, a) => list.forEach((p, i) => { if (!p.dead) p.boost = Math.round(clamp(50 + 46 * Math.sin(k * (1.1 + i * 0.37) + a * 2 + i), 0, 100)); }));

    const sec = Math.max(0, 187 - Math.floor(k));

  // ------------------------------------------------------------------ 8. le mur
  $('wall').innerHTML = T.wall.map((n, i) => `<span class="chip ${i === 0 ? 'brand' : i === 7 ? 'vio' : ''} a-pop" style="--at:${(42.75 + i * 0.13).toFixed(2)}s">${n}</span>`).join('');

  // ------------------------------------------------------------------ le temps
  const scenes = [...document.querySelectorAll('[data-in]')];
  let lastCtr = '';
  window.setTime = (t) => {
    for (const s of scenes) s.classList.toggle('on', t >= +s.dataset.in && t < +s.dataset.out);

    // 2. le total suit la grille
    const shown = SEQ.filter((_, i) => t >= 4.15 + i * 0.25 + 0.1);
    $('gw').textContent = shown.filter((r) => r === 'W').length;
    $('gl').textContent = shown.filter((r) => r === 'L').length;

    // 3. compteur : son état, et un éclat quand le bilan change
    const step = STEPS.filter((s) => t >= s.t).pop();
    const key = String(step.t);
    if (key !== lastCtr) {
      lastCtr = key;
      ctr.update(session(step.d));
    }
    const since = t - step.t;
    $('flash').style.opacity = step.t > 0 && !step.d.overtime && since >= 0 && since < 0.5 ? 0.55 * (1 - since / 0.5) : 0;

    // 4. fenêtres : une légère dérive
    for (const [id, a, b, dir] of [['w4', 15.8, 18.8, 1], ['w4b', 18.8, 21.8, -1], ['w6', 31.6, 36.4, 1]]) {
      const k = clamp((t - a) / (b - a), 0, 1);

      $(id).style.transform = `perspective(2400px) translateX(${dir * (1 - inn) * 260}px) rotateY(${-dir * (5 - k * 2)}deg) scale(${0.97 + k * 0.03})`;
      $(id).style.opacity = inn;
    }
    {
      const k = clamp((t - 29.8) / 1.8, 0, 1);
      const inn = out3(clamp((t - 29.85) / 0.7, 0, 1));
      $('w5').style.transform = `translateY(${(1 - inn) * 120}px) scale(${0.96 + k * 0.04})`;
      $('w5').style.opacity = inn;
    }

    // 5. éditeur : le curseur prend le winrate et le déplace, change les couleurs, puis le thème change
    {
      // (repère : la toile du compteur est posée dans le cadre, lui-même à 560, 250 dans la scène ; E.k est son échelle)
      const bx = 560 + E.left + (dragBox.x + dragBox.w / 2) * E.k, by = 250 + E.top + (dragBox.y + dragBox.h / 2) * E.k;
      const drag = track([[25.15, 0], [25.6, 1]], t)[0];
      const dx = Math.round(DRAG[0] * drag), dy = Math.round(DRAG[1] * drag);
      const [cx, cy] = track([[23.6, 330, 430], [24.55, 330, 430], [25.0, bx, by], [25.15, bx, by], [25.6, bx + DRAG[0] * E.k, by + DRAG[1] * E.k], [25.9, bx + DRAG[0] * E.k, by + DRAG[1] * E.k], [26.25, 1007, 827], [26.7, 1007, 827], [26.95, 1179, 827], [27.3, 1179, 827], [27.7, 1500, 900], [29.8, 1640, 960]], t);
      $('cur5').style.transform = `translate(${cx}px, ${cy}px)`;
      dragged.forEach((e, n) => {
        dragNodes[n].style.left = `${e.x + dx}px`;
        dragNodes[n].style.top = `${e.y + dy}px`;
      });
      const sel = $('sel');
      const pad = 8;
      sel.style.left = `${E.left + (dragBox.x + dx) * E.k - pad}px`;
      sel.style.top = `${E.top + (dragBox.y + dy) * E.k - pad}px`;
      sel.style.width = `${dragBox.w * E.k + pad * 2}px`;
      sel.style.height = `${(Math.max(...dragged.map((e) => e.y + e.h)) - dragBox.y) * E.k + pad * 2}px`;
      sel.style.opacity = t >= 25.02 && t < 25.9 ? 1 : 0;
      // couleurs : trois palettes, fondues l'une dans l'autre
      const pk = track([[26.32, 0], [26.57, 1], [27.02, 1], [27.25, 2]], t)[0];
      const a = Math.min(1, Math.floor(pk));
      const cols = [0, 1, 2].map((n) => mix(PALETTES[a][n], PALETTES[a + 1][n], pk - a));
      ['win', 'loss', 'ot'].forEach((key, n) => $('ed0').style.setProperty(`--${key}`, cols[n]));
      [0, 1, 2].forEach((n) => $(`sw${n}`).classList.toggle('on', Math.round(pk) === n));
      // clics
      const click = [25.0, 26.3, 27.0].map((c) => t - c).find((d) => d >= 0 && d < 0.4);
      const ring = $('ring5');
      ring.style.opacity = click == null ? 0 : 0.9 * (1 - click / 0.4);
      ring.style.transform = `translate(${cx + 6}px, ${cy + 4}px) scale(${click == null ? 0.3 : 0.3 + click * 2})`;
      // le compteur d'origine laisse la place aux autres thèmes
      $('ed0').style.opacity = 1 - clamp((t - 27.6) / 0.3, 0, 1);
      const cur = t < 27.6 ? 0 : t < 28.3 ? 1 : t < 29.0 ? 2 : 3;
      for (const n of $('names').children) n.classList.toggle('on', +n.dataset.n === cur);
    }

    // 6. galerie : le curseur va sur « Installer » et clique
    {
      // (la cible est le bouton « Installer » du premier thème, là où la fenêtre inclinée l'affiche)
      const film = $('film').getBoundingClientRect();
      const hot = $('hot6').getBoundingClientRect();
      const k = film.width / 1920 || 1;
      const hx = (hot.left - film.left) / k, hy = (hot.top - film.top) / k;
      const [cx, cy] = track([[31.6, 1560, 1000], [33.0, 1560, 1000], [34.0, hx, hy], [36.4, hx, hy]], t);
      $('cur6').style.transform = `translate(${cx}px, ${cy}px)`;
      $('cur6').style.opacity = clamp((t - 32.9) / 0.3, 0, 1);
      const click = t - 34.12;
      const ring = $('ring6');
      ring.style.opacity = click >= 0 && click < 0.45 ? 0.9 * (1 - click / 0.45) : 0;
      ring.style.transform = `translate(${cx + 6}px, ${cy + 4}px) scale(${0.3 + Math.max(0, click) * 2})`;
    }

    // 7. Boost : le bilan bouge ; caster : la partie vit
    if (t >= 36 && t < 39.5) boost.update({ ...session(t >= 38.0 ? { wins: 13, winRate: 72, streak: 4, mmrDelta: 57 } : {}), inMatch: true, teamColor: '#ff7f22' });
    if (t >= 39 && t < 42.6) cast.update(casterState(t));

    for (const [a, b, fn] of REFRESH) if (t >= a && t < b) fn();

    for (const a of document.getAnimations()) {
      a.pause();
      a.currentTime = t * 1000;
    }
  };

  // ------------------------------------------------------------------ bande-son (rendue hors ligne par render.js)
  // Rythme à 120 BPM et les vrais sons d'alerte de RL-UI (web/shared/sfx.js). Renvoie { peak, bytes } : PCM 16 bits stéréo, 44,1 kHz.
  window.promoAudio = async (sfxCode) => {
    const R = 44100;
    const oc = new OfflineAudioContext(2, Math.ceil(R * DURATION), R);
    window.AudioContext = function () { return oc; };
    (0, eval)(sfxCode);
    const music = oc.createGain();
    music.gain.value = 0.68;
    music.connect(oc.destination);
    const env = (node, t, peak, a, d) => { const g = oc.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); node.connect(g); return g; };
    const osc = (type, f, t, len) => { const o = oc.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + len + 0.05); return o; };
    const hz = (n) => 440 * 2 ** ((n - 69) / 12);
    const noiseBuf = (() => { const b = oc.createBuffer(1, R, R), d = b.getChannelData(0); for (let i = 0; i < R; i++) d[i] = Math.random() * 2 - 1; return b; })();
    const noise = (t, len) => { const s = oc.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t); s.stop(t + len + 0.05); return s; };
    const kick = (t, v = 0.9) => { const o = osc('sine', 120, t, 0.3); o.frequency.exponentialRampToValueAtTime(40, t + 0.22); env(o, t, v, 0.003, 0.28).connect(music); };
    const hat = (t, v = 0.12) => { const f = oc.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; noise(t, 0.06).connect(f); env(f, t, v, 0.002, 0.05).connect(music); };
    const clap = (t, v = 0.25) => { const f = oc.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 0.8; noise(t, 0.2).connect(f); env(f, t, v, 0.003, 0.16).connect(music); };
    const bass = (n, t, len, v = 0.22) => { const o = osc('sawtooth', hz(n), t, len); const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; o.connect(f); env(f, t, v, 0.008, len).connect(music); };
    const pluck = (n, t, v = 0.05) => { const o = osc('triangle', hz(n), t, 0.22); const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600; o.connect(f); env(f, t, v, 0.004, 0.2).connect(music); };
    const whoosh = (t, len = 0.6, v = 0.3) => { const f = oc.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(6000, t + len); noise(t, len).connect(f); env(f, t, v, len * 0.75, len * 0.25).connect(oc.destination); };
    const pad = (notes, t, len, v = 0.028) => notes.forEach((n) => [-8, 8].forEach((dt) => { const o = osc('sawtooth', hz(n), t, len); o.detune.value = dt; const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1700; o.connect(f); env(f, t, v, 0.4, len - 0.4).connect(music); }));

    // quatre accords de deux secondes : do, la mineur, fa, sol ; le rythme entre à la 2e scène et s'arrête avant la fin
    const roots = [36, 33, 29, 31];
    const chords = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]];
    const START = 3.8, END = 44.8;
    for (let t = START; t < END - 0.01; t += 0.5) {
      const beat = Math.round((t - START) / 0.5);
      const bar = Math.floor((t - START) / 2) % 4;
      const calm = (t >= 15.8 && t < 21.8) || (t >= 31.6 && t < 36.4); // scènes de l'app : sans caisse claire
      kick(t, calm ? 0.7 : 0.9);
      hat(t + 0.25);
      if (!calm && beat % 2 === 1) clap(t);
      bass(roots[bar], t + 0.25, 0.2);
      if (beat % 4 === 3) bass(roots[bar] + 12, t + 0.375, 0.1, 0.16);
      // l'éditeur et la galerie : un arpège par-dessus
      if (t >= 21.8 && t < 36.4) [0, 1, 2, 3].forEach((i) => pluck(chords[bar][(beat + i) % 4] + 12, t + i * 0.125, 0.055));
    }
    for (let t = START; t < END - 0.01; t += 2) pad(chords[Math.floor((t - START) / 2) % 4], t, 2.1, 0.034);
    // la musique se retire sous les alertes
    for (const [a, b] of [[9.2, 11.1], [11.4, 13.2], [13.5, 15.6]]) { music.gain.setValueAtTime(0.68, a - 0.05); music.gain.linearRampToValueAtTime(0.4, a + 0.05); music.gain.setValueAtTime(0.4, b); music.gain.linearRampToValueAtTime(0.68, b + 0.3); }
    for (const t of [3.35, 7.35, 15.35, 21.35, 31.15, 35.95, 41.95, 44.55]) whoosh(t + 0.05);
    // ouverture : un impact quand la balle se pose ; fin : un accord tenu
    whoosh(0.2, 0.7, 0.2); kick(1.5, 1); pad([48, 55, 60, 64, 67], 1.5, 2.2, 0.03);
    kick(45.0, 1); pad([48, 55, 60, 64, 67], 45.0, 3.9, 0.034);
    const at = (t, fn) => oc.suspend(t).then(() => { fn(); oc.resume(); });
    at(9.2, () => SFX.play('win', 0.62));
    at(11.4, () => SFX.play('overtime', 0.62));
    at(13.5, () => SFX.play('ot_win', 0.62));
    at(45.2, () => SFX.play('streak', 0.45));
    const buf = await oc.startRendering();
    const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    let peak = 0;
    for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rr[i]));
    const k = peak > 0.95 ? 0.95 / peak : 1;
    const pcm = new Int16Array(L.length * 2);
    for (let i = 0; i < L.length; i++) { pcm[2 * i] = L[i] * k * 32767; pcm[2 * i + 1] = Rr[i] * k * 32767; }
    // (en base 64 : un tableau de plusieurs millions de nombres passerait mal d'une page à son lanceur)
    const u8 = new Uint8Array(pcm.buffer);
    let bin = '';
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return { peak, base64: btoa(bin) };
  };

  window.PROMO = { duration: DURATION, lang: LANG };
  window.setTime(0);

  // ------------------------------------------------------------------ lecture dans un navigateur (?play=1)
  if (Q.has('play')) {
    const fit = () => { const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); $('film').style.transform = `scale(${k})`; document.documentElement.style.cssText = 'width:100vw;height:100vh'; document.body.style.cssText = 'width:100vw;height:100vh'; };
    window.addEventListener('resize', fit);
    fit();
    const t0 = performance.now() - (Number(Q.get('t')) || 0) * 1000;
    const loop = () => { window.setTime(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    document.fonts.ready.then(loop);
  }
})();
</script>
